---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoon
  namespace: os-service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockoon
  template:
    metadata:
      labels:
        app: mockoon
    spec:
      containers:
        - name: mockoon
          image: mockoon/cli:latest
          args: ["--data", "/data/tech_challenge.json", "--port", "8083", "--hostname", "0.0.0.0"]
          ports:
            - containerPort: 8083
          volumeMounts:
            - name: mockoon-data
              mountPath: /data
      volumes:
        - name: mockoon-data
          configMap:
            name: mockoon-config
            items:
              - key: tech_challenge.json
                path: tech_challenge.json
---
apiVersion: v1
kind: Service
metadata:
  name: mockoon
  namespace: os-service-api
spec:
  selector:
    app: mockoon
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  type: ClusterIP
